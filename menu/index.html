<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Menu condiviso</title>
<style>
  :root { color-scheme: light dark; --bg: #f8f9fa; --card: #ffffff; --text: #191c1d; --muted: #5a6168; --primary: #1565C0; --on-primary: #ffffff; --line: #e1e3e4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111417; --card: #1c2023; --text: #e8eaed; --muted: #a0a5aa; --primary: #7fb0f0; --on-primary: #0b2545; --line: #2c3136; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 22px; line-height: 1.25; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .open { display: block; width: 100%; padding: 14px; border-radius: 14px; background: var(--primary); color: var(--on-primary); font-weight: 700; text-align: center; text-decoration: none; margin-bottom: 16px; }
  .day { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }
  .day h2 { font-size: 14px; margin: 0 0 4px; text-transform: capitalize; }
  .meal { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
  .meal b { color: var(--muted); font-weight: 600; }
  .note { color: var(--muted); font-size: 13px; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Menu condiviso</h1>
  <p class="sub" id="sub"></p>
  <a class="open" id="open" href="#" hidden>Apri in MyLifeApp</a>
  <div id="days"></div>
  <p class="note" id="note" hidden>Per aggiungerlo al tuo menu serve MyLifeApp aggiornata.</p>
</main>
<script>
  // Il menu è tutto nel link, dopo il #: quella parte non viene mai inviata al sito.
  (function () {
    var code = (location.hash || '').slice(1).replace(/[^A-Za-z0-9_-]/g, '');
    var title = document.getElementById('title');
    var sub = document.getElementById('sub');
    if (!code) {
      sub.textContent = 'Questo link non contiene un menu.';
      return;
    }
    var data = null;
    try {
      var b64 = code.replace(/-/g, '+').replace(/_/g, '/');
      var binary = atob(b64 + '==='.slice((b64.length + 3) % 4));
      var bytes = Uint8Array.from(binary, function (c) { return c.charCodeAt(0); });
      data = JSON.parse(new TextDecoder().decode(bytes));
    } catch (e) { data = null; }
    if (!data || !Array.isArray(data.d)) {
      sub.textContent = 'Questo link non contiene un menu valido.';
      return;
    }

    var name = typeof data.n === 'string' ? data.n.slice(0, 40) : '';
    if (name) title.textContent = name + ' ti ha mandato il menu';
    sub.textContent = 'Pranzi e cene della settimana';

    // Apre l'app; se non è installata resta su questa pagina
    var open = document.getElementById('open');
    var fallback = encodeURIComponent(location.href);
    open.href = 'intent://menu?d=' + code + '#Intent;scheme=mylifeapp;package=com.FreeStuffDeveloper.MyLifeApp;S.browser_fallback_url=' + fallback + ';end';
    open.hidden = false;
    document.getElementById('note').hidden = false;

    var parts = String(data.s || '').split('-').map(Number);
    var box = document.getElementById('days');
    data.d.slice(0, 31).forEach(function (pair, i) {
      if (!Array.isArray(pair) || (!pair[0] && !pair[1])) return;
      var day = new Date(parts[0], parts[1] - 1, parts[2] + i, 12);
      var card = document.createElement('section');
      card.className = 'day';
      var head = document.createElement('h2');
      head.textContent = isNaN(day.getTime()) ? '' : day.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
      card.appendChild(head);
      [['Pranzo', pair[0]], ['Cena', pair[1]]].forEach(function (slot) {
        if (!slot[1]) return;
        var row = document.createElement('p');
        row.className = 'meal';
        var label = document.createElement('b');
        label.textContent = slot[0] + ': ';
        row.appendChild(label);
        row.appendChild(document.createTextNode(String(slot[1]).slice(0, 120)));
        card.appendChild(row);
      });
      box.appendChild(card);
    });
  })();
</script>
</body>
</html>
